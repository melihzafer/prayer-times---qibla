<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prayer Times & Qibla</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            animation: {
              shine: 'shine 1.5s infinite',
            },
            keyframes: {
              shine: {
                '0%': { left: '-100%' },
                '100%': { left: '200%' },
              }
            }
          }
        }
      }
    </script>
    <meta name="description" content="Prayer Times, Qibla Direction, and Islamic Calendar">
    <meta name="theme-color" content="#1a202c">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="mask-icon" href="/mask-icon.svg" color="#FFFFFF">
    <script>
      // Apply theme on initial load
      (function() {
        let theme = localStorage.getItem('theme');
        let isDark;
        if (theme === null) {
          // No theme set, use system preference
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          // Handles both old raw string 'dark' and new JSON string '"dark"'
          isDark = theme === 'dark' || theme === '"dark"';
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://esm.sh/@google/genai",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <div id="root"></div>
    <div id="notification-portal"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
